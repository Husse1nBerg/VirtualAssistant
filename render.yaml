# Render Blueprint — deploy with "New > Blueprint" in Render dashboard
services:
  - type: web
    name: virtual-assistant
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: USE_OPENAI_FOR_AGENT
        value: 'true'
      - key: OWNER_PHONE_NUMBER
        sync: false
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      # deepgram (Aura-2) or elevenlabs. ElevenLabs needs the API key; the voice id
      # defaults to Sky's chosen voice in agentPrompt.ts and can be overridden here.
      # sync: false — set in the Render dashboard. A fixed value here is re-applied on
      # every Blueprint sync and silently overwrote the dashboard switch to elevenlabs.
      - key: TTS_PROVIDER
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # Grok Bot link (all sync: false; set in the dashboard).
      - key: GROK_BOTS
        sync: false
      - key: GROK_DEFAULT_BOT
        sync: false
      - key: BOT_CONNECTOR_SECRET
        sync: false
      - key: OWNER_PIN
        sync: false
      - key: OWNER_TIMEZONE
        sync: false
      # Absolute path onto the mounted persistent disk. A relative file: URL is
      # resolved against the prisma/ schema folder (ephemeral!), which silently
      # wiped the DB on every deploy — contacts and call history were lost.
      - key: DATABASE_URL
        value: file:/opt/render/project/src/data/assistant.db
      - key: LOG_LEVEL
        value: info
    disk:
      name: assistant-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
